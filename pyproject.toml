[project]
name = "uav-dispatch"
version = "0.1.0"
description = "低空经济场景下的物流无人机调度算法"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
uav-dispatch = "uav_dispatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["algorithm/src"]

[tool.pytest.ini_options]
testpaths = ["algorithm/tests"]
pythonpath = ["algorithm/src"]
