<div id="relay-comparison-20261013">
  <h3>30 秒验证 · 预部署＋中继 · 3 个配对种子</h3>
  <div class="viz-row text-small"><span>候选 − 旧算法</span><span>三级目标：1 胜 · 0 平 · 2 负</span></div>
  <div class="viz-grid">
    <div><h3>逾期任务变化（项）</h3><svg data-metric="late" role="img" aria-label="三个种子的逾期变化分别为0、增加1项、0"></svg></div>
    <div><h3>航程变化（km）</h3><svg data-metric="distance" role="img" aria-label="三个种子的航程变化与旧算法比较"></svg></div>
    <div><h3>总逾期变化（min，项目次级）</h3><svg data-metric="lateness" role="img" aria-label="三个种子的总逾期分钟变化，与官方按时数区别展示"></svg></div>
  </div>
</div>
<style>
#relay-comparison-20261013 svg{display:block;width:100%;overflow:hidden}
#relay-comparison-20261013 svg text{fill:var(--foreground);font-size:12px;font-weight:400}
</style>
<script>
(() => {
  const root = document.getElementById('relay-comparison-20261013');
  const data = {
    late:{unit:'项',digits:0,values:[0,1,0]},
    distance:{unit:'km',digits:3,values:[0.054,-4.947,-0.756]},
    lateness:{unit:'min',digits:3,values:[-0.149,-70.178,5.062]}
  };
  const names = ['1821','1822','1823'];
  function draw() {
    root.querySelectorAll('svg').forEach(svg => {
      const d=data[svg.dataset.metric],w=svg.parentElement.getBoundingClientRect().width,h=210;
      const left=64,right=48,top=20,bottom=170,range=Math.max(...d.values.map(Math.abs),d.unit==='项'?1:.01)*1.3;
      const x=v=>left+(v+range)/(2*range)*(w-left-right);
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      let marks=`<title>${svg.getAttribute('aria-label')}</title><rect data-chart-frame="true" x="${left}" y="${top}" width="${w-left-right}" height="${bottom-top}" fill="none" stroke="var(--border)"/><line x1="${x(0)}" x2="${x(0)}" y1="${top}" y2="${bottom}" stroke="var(--border)"/>`;
      d.values.forEach((v,i)=>{
        const y=43+i*48,label=(v>0?'+':'')+v.toFixed(d.digits);
        marks+=`<text x="${left-8}" y="${y+4}" text-anchor="end">${names[i]}</text><line x1="${x(0)}" x2="${x(v)}" y1="${y}" y2="${y}" stroke="var(--viz-series-1)"/><circle cx="${x(v)}" cy="${y}" r="4" fill="var(--viz-series-1)"/><text x="${x(v)}" y="${y-11}" text-anchor="middle">${label}</text>`;
      });
      marks+=`<text x="${x(0)}" y="190" text-anchor="middle">0</text><text class="axis-title" data-axis="x" x="${w-right}" y="205" text-anchor="end">候选 − 旧算法（${d.unit}）</text><text class="axis-title" data-axis="y" x="4" y="15">种子</text>`;
      svg.innerHTML=marks;
    });
  }
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
